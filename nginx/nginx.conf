# Docker DNS (127.0.0.11) возвращает адреса всех реплик сервиса; resolver с коротким valid
# заставляет nginx перерезолвить имя, поэтому реплики можно добавлять/убирать без рестарта nginx.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $backend_up  http://backend:8000;
    set $frontend_up http://frontend:3000;

    location ~ ^/(api|bot|health|docs|openapi.json) {
        proxy_pass $backend_up;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $frontend_up;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
